[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsfeed-cli"
version = "0.1.0"
description = "Aggregate headlines from RSS feeds into a clean terminal feed."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["typer>=0.9", "rich>=13", "requests>=2.28", "feedparser>=6", "platformdirs>=3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
newsfeed = "newsfeed.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
